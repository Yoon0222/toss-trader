[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "toss-trader"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.29,<1", "redis>=5,<9", "pydantic-settings>=2,<3", "alembic>=1.13,<2", "httpx>=0.27,<1", "tzdata>=2025.2"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "aiosqlite>=0.20,<1"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


[tool.setuptools.package-data]
app = ["static/*.html", "static/*.css", "static/*.js"]
