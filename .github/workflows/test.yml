name: Phase 1 tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: trader
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trader -d trader"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://trader:ci-test-only@localhost:5432/trader
      REDIS_URL: redis://localhost:6379/0
      SERVICE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: alembic upgrade head
      - run: pytest -q
